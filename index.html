<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Aula PT · CEIP Capitulaciones</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=Andika:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --color-primary:#2563eb; --color-primary-light:#dbeafe; --color-primary-dark:#1d4ed8;
  --color-secondary:#0f2f6b; --color-accent:#f59e0b;
  --color-bg:#f8fbff; --color-surface:#ffffff; --color-border:#dbe4f0;
  --color-text:#1e293b; --color-text-muted:#5b6b82;
  --color-success:#16a34a; --color-success-bg:#dcfce7;
  --color-error:#dc2626; --color-error-bg:#fee2e2;
  --color-warning:#b45309; --color-warning-bg:#fef3c7;
  --color-info:#0e7490; --color-info-bg:#e0f2fe;
  --font-display:'Baloo 2',system-ui,sans-serif; --font-body:'Nunito',system-ui,sans-serif;
  --radius-sm:8px; --radius-md:12px; --radius-lg:18px; --radius-xl:24px;
  --shadow-card:0 2px 8px rgba(15,47,107,.07),0 0 0 1px rgba(15,47,107,.05);
  --shadow-md:0 6px 18px rgba(15,47,107,.12);
  --c-grafia:#2563eb; --c-lectura:#7c3aed; --c-fono:#db2777; --c-num:#ea580c; --c-ffee:#0d9488; --c-comp:#16a34a; --c-alum:#475569;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{font-family:var(--font-body);color:var(--color-text);background:var(--color-bg);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(120deg,#e0f2fe,#ede9fe,#fef9c3,#dcfce7,#fce7f3,#e0f2fe);background-size:400% 400%;animation:bgmove 40s ease infinite;opacity:.75}
@keyframes bgmove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0 0 .4em;color:var(--color-secondary)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--color-primary);outline-offset:3px}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:10px 16px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--color-border)}
.logo{width:44px;height:44px;object-fit:contain;border-radius:10px;background:#fff}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:0;flex:1}
.brand b{font-family:var(--font-display);font-size:1.35rem;color:var(--color-secondary)}
.brand span{font-size:.85rem;color:var(--color-text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:none;background:transparent;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--color-secondary);font-size:1.2rem}
.icon-btn:hover{background:var(--color-primary-light)}
.alumno-chip{display:flex;align-items:center;gap:8px;border:2px solid var(--color-border);background:#fff;border-radius:999px;padding:8px 14px;min-height:44px;cursor:pointer;font-weight:700;max-width:46vw}
.alumno-chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alumno-chip .dot{width:12px;height:12px;border-radius:50%;background:#cbd5e1;flex:none}
.alumno-chip.on{border-color:var(--color-success)} .alumno-chip.on .dot{background:var(--color-success)}
main{max-width:1280px;margin:0 auto;padding:18px 16px 60px}
.view{display:none;animation:fadeIn .25s ease} .view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow-card)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--radius-md);padding:10px 18px;min-height:44px;font-weight:700;cursor:pointer;background:var(--color-primary);color:#fff;transition:background .15s,transform .1s,box-shadow .15s;box-shadow:0 3px 0 var(--color-primary-dark)}
.btn:hover{background:var(--color-primary-dark)} .btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--color-primary-dark)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.sec{background:#fff;color:var(--color-secondary);border:2px solid var(--color-border);box-shadow:0 3px 0 var(--color-border)}
.btn.sec:hover{background:var(--color-primary-light)}
.btn.ok{background:var(--color-success);box-shadow:0 3px 0 #15803d} .btn.ok:hover{background:#15803d}
.btn.warn{background:#f59e0b;box-shadow:0 3px 0 #b45309;color:#3b1d00} .btn.danger{background:var(--color-error);box-shadow:0 3px 0 #991b1b}
.btn.big{font-size:1.15rem;padding:14px 24px;min-height:56px}
.btn.sm{padding:6px 12px;min-height:38px;font-size:.92rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--color-text-muted)} .small{font-size:.88rem}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem;color:var(--color-secondary)}
input[type=text],input[type=number],select,textarea{border:2px solid var(--color-border);border-radius:var(--radius-sm);padding:9px 11px;background:#fff;min-height:44px;width:100%}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--color-primary);outline:none}
.seg{display:inline-flex;flex-wrap:wrap;background:#eef3fb;border-radius:12px;padding:4px;gap:4px}
.seg button{border:none;background:transparent;border-radius:9px;padding:8px 12px;min-height:40px;cursor:pointer;font-weight:700;color:var(--color-text-muted)}
.seg button.on{background:#fff;color:var(--color-primary-dark);box-shadow:var(--shadow-card)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--color-primary-light);color:var(--color-primary-dark);font-weight:700;font-size:.85rem}
.hero{display:flex;align-items:center;gap:18px;margin:6px 0 20px;flex-wrap:wrap}
.hero h1{font-size:clamp(1.8rem,4vw,2.6rem);margin:0}
.grid-mod{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.mod{position:relative;text-align:left;border:none;cursor:pointer;background:#fff;border-radius:var(--radius-xl);padding:20px;box-shadow:var(--shadow-card);transition:transform .18s,box-shadow .18s;min-height:170px;display:flex;flex-direction:column;gap:8px;overflow:hidden;color:inherit;text-decoration:none}
.mod:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.mod .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;font-size:1.7rem;font-family:var(--font-display);font-weight:800}
.mod h3{margin:4px 0 0;font-size:1.3rem}
.mod p{margin:0;color:var(--color-text-muted);font-size:.95rem}
.mod.feat{grid-column:span 2;background:linear-gradient(135deg,#fff,#eff6ff)}
@media(max-width:600px){.mod.feat{grid-column:span 1}}
.mod .tag{position:absolute;top:14px;right:14px}
/* ===== Grafía ===== */
.gr-layout{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.gr-layout{grid-template-columns:1fr}}
.panel{display:flex;flex-direction:column;gap:14px}
.panel h4{margin:0 0 6px;font-family:var(--font-display);color:var(--color-secondary);font-size:1rem}
.letras{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.letras button{border:2px solid var(--color-border);background:#fff;border-radius:10px;min-height:42px;font-size:1.15rem;font-weight:800;cursor:pointer;color:var(--color-secondary);position:relative}
.letras button.on{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
.letras button.ref::after{content:'';position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--color-accent)}
.letras button.wide{grid-column:span 2;font-size:.95rem}
.board-wrap{display:flex;flex-direction:column;gap:12px}
.board-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.item-txt{font-family:'Andika',var(--font-body);font-size:1.6rem;font-weight:700;color:var(--color-secondary)}
.board{position:relative;background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-card);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.board svg,.board canvas{position:absolute;left:0;top:0}
.board canvas{cursor:crosshair}
.copy-model{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:6px;overflow:hidden}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.feedback{border-radius:var(--radius-md);padding:12px 16px;display:none;gap:12px;align-items:flex-start;font-weight:600}
.feedback.show{display:flex}
.feedback.good{background:var(--color-success-bg);color:#14532d} .feedback.mid{background:var(--color-warning-bg);color:#78350f} .feedback.bad{background:var(--color-error-bg);color:#7f1d1d}
.stars{font-size:1.6rem;letter-spacing:2px;white-space:nowrap}
.feedback ul{margin:4px 0 0;padding-left:18px;font-weight:600}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--color-text-muted)}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px}
/* ===== Lectura ===== */
.lec-layout{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.lec-layout{grid-template-columns:1fr}}
.lectura-box{background:#fffdf7;border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:28px 30px;min-height:300px}
.lectura-box h2{font-family:inherit}
.texto-lec{font-size:28px;line-height:1.9;word-spacing:.2em;color:#1f2937}
.texto-lec .w{border-radius:6px;padding:0 2px;transition:background .15s,opacity .2s;cursor:pointer}
.texto-lec .w.dim{opacity:.18}
.texto-lec .w.now{background:#fde68a}
.texto-lec .w.err{background:#fecaca;text-decoration:line-through wavy #dc2626}
.texto-lec .w.last{outline:3px solid var(--color-primary);outline-offset:1px}
.texto-lec .s0{color:#1d4ed8} .texto-lec .s1{color:#dc2626}
.texto-lec .Lb{color:#dc2626;font-weight:800} .texto-lec .Ld{color:#16a34a;font-weight:800} .texto-lec .Lp{color:#7c3aed;font-weight:800} .texto-lec .Lq{color:#ea580c;font-weight:800}
.crono{font-family:var(--font-display);font-size:2.4rem;font-weight:800;color:var(--color-secondary);font-variant-numeric:tabular-nums}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat div{background:#fff;border-radius:var(--radius-md);padding:12px;box-shadow:var(--shadow-card);text-align:center}
.stat b{display:block;font-family:var(--font-display);font-size:1.7rem;color:var(--color-secondary)}
.stat span{font-size:.82rem;color:var(--color-text-muted)}
/* ===== Ejercicios ===== */
.ex-wrap{max-width:820px;margin:0 auto}
.ex-card{background:#fff;border-radius:var(--radius-xl);box-shadow:var(--shadow-card);padding:24px;text-align:center}
.ex-q{font-family:var(--font-display);font-size:1.5rem;color:var(--color-secondary);margin:6px 0 14px}
.ex-big{font-family:'Andika',var(--font-body);font-size:clamp(2.2rem,7vw,3.6rem);font-weight:700;color:#0f172a;margin:10px 0 18px;letter-spacing:.03em}
.opts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.opt{min-width:90px;min-height:64px;font-size:1.6rem;font-family:'Andika',var(--font-body);font-weight:700;border:3px solid var(--color-border);background:#fff;border-radius:16px;cursor:pointer;padding:6px 18px;transition:transform .1s,background .15s}
.opt:hover{border-color:var(--color-primary)} .opt:active{transform:scale(.96)}
.opt.ok{background:var(--color-success-bg);border-color:var(--color-success)} .opt.no{background:var(--color-error-bg);border-color:var(--color-error);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.progress{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--color-primary),#7c3aed);transition:width .3s}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:66px}
.tile{min-width:56px;min-height:56px;padding:6px 14px;font-size:1.6rem;font-family:'Andika',var(--font-body);font-weight:700;background:#eff6ff;border:2px solid #bfdbfe;border-radius:12px;cursor:pointer}
.tile.used{visibility:hidden}
.slot{border-bottom:3px dashed #94a3b8;min-width:220px;min-height:60px;display:flex;gap:6px;justify-content:center;align-items:center;font-family:'Andika',var(--font-body);font-size:2rem;font-weight:700;margin:0 auto 14px;padding:0 10px}
.res{margin-top:14px;font-weight:700;min-height:1.5em}
.res.ok{color:var(--color-success)} .res.no{color:var(--color-error)}
.diff span{font-family:'Andika',var(--font-body);font-size:2rem}
.diff .bad{background:var(--color-error-bg);color:var(--color-error);border-radius:4px}
.diff .miss{color:var(--color-error);text-decoration:underline}
.act-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.act{border:2px solid var(--color-border);background:#fff;border-radius:var(--radius-lg);padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:110px;transition:transform .15s,border-color .15s}
.act:hover{border-color:var(--color-primary);transform:translateY(-2px)}
.act b{font-family:var(--font-display);font-size:1.15rem;color:var(--color-secondary)}
.act span{font-size:.9rem;color:var(--color-text-muted)}
.cfg{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:12px 0 16px}
.cfg label.f{min-width:160px}
/* números */
.recta{width:100%;height:150px;touch-action:none;cursor:pointer}
.bloques{display:flex;gap:18px;justify-content:center;align-items:flex-end;flex-wrap:wrap;min-height:120px;margin:10px 0}
.b-cen{width:72px;height:72px;background:repeating-linear-gradient(0deg,#fdba74 0 6px,#fb923c 6px 7.2px),#fdba74;border:2px solid #c2410c;border-radius:3px;background-image:linear-gradient(#c2410c 1px,transparent 1px),linear-gradient(90deg,#c2410c 1px,transparent 1px);background-size:7.2px 7.2px}
.b-dec{width:9px;height:72px;background:#60a5fa;border:2px solid #1d4ed8;border-radius:2px;background-image:linear-gradient(#1d4ed8 1px,transparent 1px);background-size:100% 7.2px}
.b-uni{width:10px;height:10px;background:#4ade80;border:2px solid #15803d;border-radius:2px}
.bgroup{display:flex;gap:4px;flex-wrap:wrap;align-items:flex-end;max-width:260px}
.bgroup.u{max-width:70px}
.marco{display:inline-grid;grid-template-columns:repeat(5,46px);gap:4px;padding:6px;background:#334155;border-radius:8px;margin:6px}
.marco i{width:46px;height:46px;background:#fff;border-radius:4px;display:grid;place-items:center}
.marco i.on::after{content:'';width:34px;height:34px;border-radius:50%;background:#ef4444}
.puntos{width:260px;height:260px;margin:0 auto;position:relative;background:#fff;border-radius:18px;border:2px solid var(--color-border)}
.puntos i{position:absolute;width:30px;height:30px;border-radius:50%;background:#2563eb}
/* FFEE */
.agenda{display:flex;flex-direction:column;gap:10px;max-width:640px;margin:0 auto}
.paso{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:var(--shadow-card);border:3px solid transparent;font-size:1.3rem;font-weight:700}
.paso .em{font-size:2rem;width:48px;text-align:center}
.paso.now{border-color:var(--color-primary);background:#eff6ff}
.paso.done{opacity:.55;text-decoration:line-through}
.paso button{margin-left:auto}
.timer-svg{width:min(70vw,340px);height:min(70vw,340px);display:block;margin:10px auto}
.auto-card{max-width:620px;margin:0 auto;background:#fff;border-radius:28px;box-shadow:var(--shadow-md);padding:30px;text-align:center}
.auto-card .em{font-size:4.5rem}
.auto-card h2{font-size:clamp(1.6rem,4vw,2.3rem)}
.seq{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:90px;align-items:center}
.seq i{width:76px;height:76px;border-radius:18px;display:grid;place-items:center;font-style:normal;font-family:var(--font-display);font-weight:800;font-size:2.4rem;color:#fff;background:var(--color-primary)}
.tachado{display:grid;gap:4px;justify-content:center;margin:10px auto}
.tachado button{width:44px;height:44px;border:1px solid var(--color-border);background:#fff;border-radius:8px;font-family:'Andika',var(--font-body);font-size:1.5rem;font-weight:700;cursor:pointer;padding:0}
.tachado button.hit{background:var(--color-success-bg);border-color:var(--color-success);color:#15803d;text-decoration:line-through}
.tachado button.miss{background:var(--color-error-bg);border-color:var(--color-error)}
/* alumnos */
.al-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.al{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:16px;border:3px solid transparent;display:flex;flex-direction:column;gap:8px}
.al.on{border-color:var(--color-success)}
.al h3{margin:0;font-size:1.25rem}
.needs{display:flex;gap:6px;flex-wrap:wrap}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;gap:6px;align-items:center;background:#f1f5f9;border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.92rem}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--color-border);text-align:left}
table.t th{color:var(--color-secondary);font-family:var(--font-display)}
table.t tr:nth-child(even) td{background:#f8fafc}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.lgrid div{border-radius:10px;padding:6px;text-align:center;font-weight:800;font-size:1.2rem;border:2px solid var(--color-border);background:#fff}
.lgrid div small{display:block;font-size:.7rem;font-weight:700;color:var(--color-text-muted)}
.lgrid .n3{background:#dcfce7;border-color:#86efac} .lgrid .n2{background:#fef9c3;border-color:#fde047} .lgrid .n1{background:#fee2e2;border-color:#fca5a5}
/* modal & toast */
.modal-back{position:fixed;inset:0;background:rgba(15,47,107,.28);display:grid;place-items:center;z-index:200;padding:16px}
.modal-back[hidden]{display:none}
.modal{background:#fff;border-radius:22px;max-width:620px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(15,47,107,.25);animation:fadeIn .2s}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 6px}
.modal-head h2{margin:0;font-size:1.35rem}
.modal-body{padding:8px 20px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal-foot{padding:14px 20px 18px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:300}
.toast{background:#fff;border-left:5px solid var(--color-success);border-radius:12px;padding:12px 18px;box-shadow:var(--shadow-md);font-weight:700;max-width:340px;animation:slideIn .3s}
.toast.error{border-color:var(--color-error)} .toast.info{border-color:var(--color-info)}
@keyframes slideIn{from{transform:translateX(110%);opacity:0}to{transform:none;opacity:1}}
.empty{text-align:center;padding:30px;color:var(--color-text-muted)}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media print{.top,.bg,.toolbar,.panel{display:none!important}}
@media(max-width:900px){.gr-layout .board-wrap,.lec-layout .board-wrap{order:-1}}
/* U D C UM */
:root{--c-u:#2563eb;--c-d:#dc2626;--c-c:#16a34a;--c-m:#ca8a04}
.udc{font-weight:800}.udc b{display:inline-grid;place-items:center;min-width:1.7em;height:1.7em;border-radius:6px;color:#fff;font-size:.95em;padding:0 4px;margin-right:2px}

/* ===== Separación silábica (castellano) ===== */
const VOC='aeiouáéíóúü', FUERTE='aeoáéíóú', INSEP=['pl','pr','bl','br','cl','cr','dr','fl','fr','gl','gr','tr','kl','kr','tl'];
function silabas(palabra){
  const w=palabra.toLowerCase(); const u=[];
  for(let i=0;i<w.length;i++){
    const t2=w.substr(i,2);
    if(['ch','ll','rr'].includes(t2)){u.push(t2);i++;continue;}
    if((t2==='qu'||t2==='gu')&&'eiéí'.includes(w[i+2]||'')){u.push(t2);i++;continue;}

  const nuc=[]; let i=0;

    if(tipo[i]==='V'){ let j=i; const grupo=[i];

        if(hiato) break; j++; grupo.push(j);}
      nuc.push([i,j]); i=j+1; } else i++;

    else c=s+2;
    cortes.push(c);
  }
  const out=[]; let p=0;
  cortes.forEach(c=>{out.push(u.slice(p,c).join('')); p=c;});
  out.push(u.slice(p).join(''));

function entradaAlta(d,y){

/* Compone un texto en una línea: devuelve trazos con desplazamiento, en orden de escritura */
function componer(texto){
  const out=[]; let x=0, prevHi=false, prevLetter=false, prevMin=false, wordSec=[];
  const flush=()=>{ out.push(...wordSec); wordSec=[]; };
  for(const ch of texto){
    if(ch===' '){ flush(); x+=46; prevHi=false; prevLetter=false; prevMin=false; continue; }
    const g=glyph(ch); if(!g){ x+=30; continue; }
    if(g.cap||g.p){ flush(); if(prevLetter&&g.cap) x+=10;
      g.s.forEach(d=>out.push({d,x,ch,main:true}));
      x+=g.w+(g.cap?14:0); prevHi=false; prevLetter=!g.p; prevMin=false; continue; }
    let d0=g.s[0];
    if(!prevMin&&g.ini) d0=g.ini; else if(prevHi) d0=g.alt||entradaAlta(d0,106);
    out.push({d:d0,x,ch,main:true});
    g.s.slice(1).forEach(d=>wordSec.push({d,x,ch,main:false}));
    x+=g.w-6; prevHi=!!g.hi; prevLetter=true; prevMin=true;
  }
  flush();
  return {trazos:out, ancho:x};
}

const LETRAS_GRID=['a','b','c','d','e','f','g','h','i','j','k','l','m','n','ñ','o','p','q','r','s','t','u','v','w','x','y','z','ll','ch','rr','ce','ge','gue','ü'];
const ETQ={ce:'ce ci',ge:'ge gi',gue:'gue gui','ü':'güe güi'};
const TRABADAS=['bl','br','cl','cr','dr','fl','fr','gl','gr','pl','pr','tr'];
const VOCALES='aeiou';
function silabasDe(s){
  const v=[...VOCALES];
  const esp={c:['ca','co','cu'],ce:['ce','ci'],g:['ga','go','gu'],ge:['ge','gi'],gue:['gue','gui'],'ü':['güe','güi'],q:['que','qui'],z:['za','zo','zu'],k:['ka','ke','ki','ko','ku'],x:['ax','ex','ix','ox','ux'],w:['wa','we','wi'],y:['ya','ye','yo','yu'],rr:['rra','rre','rri','rro','rru']};
  if(VOCALES.includes(s)) return [s,'m'+s,'p'+s,'l'+s,s+'l',s+'s',s+'n'];
  if(esp[s]) return esp[s];
  const directas=v.map(x=>s+x);
  const inversas=['l','s','n','r','m'].includes(s)?v.map(x=>x+s):[];
  return [...directas,...inversas];
}
function palabrasDe(s){
  let base=(PALABRAS[s]||'').split(' ').filter(Boolean);
  const re=s.length===1?s:null;
  if(re&&!TRABADAS.includes(s)){
    Object.values(PALABRAS).join(' ').split(' ').forEach(w=>{const n=w.normalize('NFD').replace(/[́]/g,'').normalize('NFC');if(n.includes(s)&&!(s==='r'&&false))base.push(w);});
  }
  return uniq(base).slice(0,30);
}
function frasesDe(s){
  const norm=t=>t.toLowerCase();
  let f=FRASES.filter(x=>norm(x).includes(s==='ü'?'ü':s));
  return f.length?f:FRASES.slice(0,20);
}
function construirItems(){
  const s=G.sel;
  if(G.tipo==='letra'){
    if(s==='MAY') return [...'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'];
    if(s==='NUM') return [...'0123456789'];
    const up=s.length===1&&L[s.toUpperCase()]?[s.toUpperCase()]:[];
    const comb={ce:['ce','ci'],ge:['ge','gi'],gue:['gue','gui'],'ü':['güe','güi']};
    return comb[s]||[s,...up];
  }
  if(G.tipo==='silaba') return (s==='MAY'||s==='NUM')?['ma','pa','la','sa','ta']:silabasDe(s);
  if(G.tipo==='palabra') return (s==='MAY'||s==='NUM')?PALABRAS.a.split(' '):palabrasDe(s);
  if(G.tipo==='frase') return frasesDe(s);
  if(G.tipo==='libre') return G.libre.split('\n').map(x=>x.trim()).filter(Boolean);

}
/* --- geometría --- */
const cacheMuestras={};
function muestrear(d){
  if(cacheMuestras[d]) return cacheMuestras[d];
  const p=$('#measure'); p.setAttribute('d',d); const len=p.getTotalLength(); const pts=[];
  const n=Math.max(2,Math.ceil(len/4));
  for(let i=0;i<=n;i++){const q=p.getPointAtLength(len*i/n);pts.push([q.x,q.y]);}
  return cacheMuestras[d]={pts,len};
}
/* Distribuye el texto en líneas que caben en el ancho (unidades) */
function partirLineas(texto,maxU){
  const pal=texto.split(' '); const lineas=[]; let cur='';
  pal.forEach(w=>{const prueba=cur?cur+' '+w:w; if(cur&&componer(prueba).ancho>maxU){lineas.push(cur);cur=w;} else cur=prueba;});
  if(cur) lineas.push(cur); return lineas;
}
const LH=340, TOPU=20;
function modeloTexto(texto,maxU,centrar){
  const lineas=partirLineas(texto,maxU); const trazos=[]; let ancho=0;
  lineas.forEach((ln,i)=>{const c=componer(ln); ancho=Math.max(ancho,c.ancho);
    const off=centrar?Math.max(0,(maxU-c.ancho)/2):0;
    c.trazos.forEach(t=>trazos.push(Object.assign({},t,{x:t.x+off+30,y:i*LH+TOPU})));});
  trazos.forEach(t=>{const m=muestrear(t.d);t.len=m.len;t.pts=m.pts.map(([a,b])=>[a+t.x,b+t.y]);});
  return {trazos,lineas,ancho};
}
function pautaSVG(tipo,x0,x1,y0,opac=1){
  const l=(y,c,w,da)=>`<line x1="${x0}" x2="${x1}" y1="${y0+y}" y2="${y0+y}" stroke="${c}" stroke-width="${w}"${da?` stroke-dasharray="${da}"`:''} opacity="${opac}"/>`;
  if(tipo==='color') return `<rect x="${x0}" y="${y0}" width="${x1-x0}" height="100" fill="#e0f2fe" opacity="${.9*opac}"/><rect x="${x0}" y="${y0+100}" width="${x1-x0}" height="100" fill="#dcfce7" opacity="${.9*opac}"/><rect x="${x0}" y="${y0+200}" width="${x1-x0}" height="100" fill="#fef3c7" opacity="${.9*opac}"/>`+l(0,'#7dd3fc',2)+l(100,'#4ade80',2.5)+l(200,'#16a34a',4)+l(300,'#fbbf24',2);
  if(tipo==='mont') return l(0,'#93c5fd',2)+l(100,'#60a5fa',2.5,'10 8')+l(200,'#1d4ed8',4)+l(300,'#93c5fd',2);
  if(tipo==='doble') return l(0,'#cbd5e1',1.5,'4 10')+l(100,'#3b82f6',3)+l(200,'#3b82f6',3)+l(300,'#cbd5e1',1.5,'4 10');
  if(tipo==='cuad'){let s='';for(let y=0;y<=300;y+=50)s+=l(y,y===200?'#3b82f6':'#cbd5e1',y===200?3:1.5);for(let x=x0;x<=x1;x+=50)s+=`<line x1="${x}" x2="${x}" y1="${y0}" y2="${y0+300}" stroke="#cbd5e1" stroke-width="1.5" opacity="${opac}"/>`;return s;}
  return l(200,'#3b82f6',3);
}
function flechas(t,cada=62){
  let s=''; const p=t.pts; let acc=0, next=26; const puestas=[];
  for(let i=1;i<p.length;i++){const dx=p[i][0]-p[i-1][0],dy=p[i][1]-p[i-1][1];const d=Math.hypot(dx,dy);acc+=d;
    if(acc>=next&&acc<t.len-12){next+=cada; if(puestas.some(q=>Math.hypot(q[0]-p[i][0],q[1]-p[i][1])<26))continue; puestas.push(p[i]);const a=Math.atan2(dy,dx)*180/Math.PI;s+=`<path d="M-7,-7 L5,0 L-7,7" transform="translate(${p[i][0]},${p[i][1]}) rotate(${a})" fill="none" stroke="#1d4ed8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`;}}
  return s;
}
function flechaInicio(t){
  const p=t.pts; let acc=0,i=1;
  for(;i<p.length;i++){acc+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);if(acc>=30)break;}
  if(i>=p.length)return '';
  const j=Math.min(p.length-1,i+3), k=Math.max(0,i-3);
  const a=Math.atan2(p[j][1]-p[k][1],p[j][0]-p[k][0])*180/Math.PI;
  return `<path d="M-10,-10 L6,0 L-10,10" transform="translate(${p[i][0]},${p[i][1]}) rotate(${a})" fill="none" stroke="#15803d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;
}
/* Puntos de inicio: primer trazo de cada palabra/mayúscula + trazos secundarios */
function iniciosDe(trazos,numerar,conFlecha=true){
  let s='', n=0, prevMain=null;
  trazos.forEach((t,i)=>{
    const ini=t.pts[0];
    const empiezaPalabra=t.main&&(!prevMain||L[t.ch]?.cap||glyph(prevMain.ch)?.cap||Math.abs((prevMain.pts.at(-1)[0])-ini[0])>30||prevMain.y!==t.y);
    if(t.main) prevMain=t;
    if(t.main&&!empiezaPalabra&&!numerar) return;
    n++;
    const col=t.main?'#16a34a':'#f97316', r=t.main?13:10;
    if(conFlecha&&t.main&&t.len>40) s+=flechaInicio(t);
    s+=`<circle cx="${ini[0]}" cy="${ini[1]}" r="${r}" fill="${col}" stroke="#fff" stroke-width="3"/>`;
    if(numerar) s+=`<text x="${ini[0]}" y="${ini[1]+5}" font-size="15" font-weight="800" text-anchor="middle" fill="#fff" font-family="Nunito">${n}</text>`;
  });
  return s;
}
function dibujoModelo(trazos,ayuda,{numerar=false,grosor=9}={}){
  let s='';
  if(ayuda===1){
    trazos.forEach(t=>s+=`<path d="${t.d}" transform="translate(${t.x},${t.y})" fill="none" stroke="#c7d2fe" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>`);
    trazos.forEach(t=>s+=`<path d="${t.d}" transform="translate(${t.x},${t.y})" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="6 7" stroke-linecap="round"/>`);
  }
  if(ayuda===2) trazos.forEach(t=>s+=`<path d="${t.d}" transform="translate(${t.x},${t.y})" fill="none" stroke="#94a3b8" stroke-width="${grosor}" stroke-dasharray="0.1 15" stroke-linecap="round"/>`);
  if(ayuda===5) trazos.forEach(t=>s+=`<path d="${t.d}" transform="translate(${t.x},${t.y})" fill="none" stroke="#1e3a8a" stroke-width="${grosor}" stroke-linecap="round" stroke-linejoin="round"/>`);
  if(ayuda<=3) s+=iniciosDe(trazos,numerar);
  return s;
}

function wireGrafia(){

  $('#grTam').onchange=e=>{G.tam=+e.target.value;guardarG();render();};

function pt(e){const r=$('#grCan').getBoundingClientRect();return [(e.clientX-r.left)/GB.k,(e.clientY-r.top)/GB.k];}

function cargarItems(reset){G.items=construirItems();if(!G.items.length)G.items=['a'];if(reset||G.idx>=G.items.length)G.idx=0;render();}
function render(keep){

  const can=$('#grCan'); const dpr=window.devicePixelRatio||1; can.width=W*dpr; can.height=H*dpr; can.style.width=W+'px'; can.style.height=H+'px';
  can.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
  if(!keep){GB.trazosUser=[];GB.resultado=null;$('#grFb').className='feedback';}
  redibujarUser();
}
function ctxUser(){const c=$('#grCan').getContext('2d');c.lineCap='round';c.lineJoin='round';c.lineWidth=Math.max(3,9*GB.k*G.grosor);return c;}
function redibujarUser(){
  const c=ctxUser(); c.clearRect(0,0,GB.W,GB.H); const k=GB.k;
  const res=GB.resultado;

function remuestrear(t,paso=4){const out=[t[0]];for(let i=1;i<t.length;i++){const a=out.at(-1),b=t[i];const d=Math.hypot(b[0]-a[0],b[1]-a[1]);if(d>=paso){const n=Math.floor(d/paso);for(let j=1;j<=n;j++)out.push([a[0]+(b[0]-a[0])*j/n,a[1]+(b[1]-a[1])*j/n]);}}return out;}
function comprobar(){
  if(!GB.trazosUser.length||GB.trazosUser.flat().length<4){toast('Primero escribe encima','info');return;}
  const m=GB.modelo; const T=G.tipo==='letra'?24:22;
  // puntos del modelo (orden de escritura)
  const mp=[]; m.trazos.forEach((t,ti)=>t.pts.forEach(p=>mp.push({x:p[0],y:p[1],ti,main:t.main})));
  let user=GB.trazosUser.map(t=>t.map(p=>[...p]));
  // en copia, alineamos horizontalmente por el centro
  let dx=0;
  if(G.ayuda===4){const cx=a=>a.reduce((s,p)=>s+p[0],0)/a.length; const uAll=user.flat(); const mm=Math.min(...mp.map(p=>p.x)),MM=Math.max(...mp.map(p=>p.x)),um=Math.min(...uAll.map(p=>p[0])),UM=Math.max(...uAll.map(p=>p[0])); dx=((mm+MM)/2)-((um+UM)/2); user=user.map(t=>t.map(([x,y])=>[x+dx,y]));}
  const us=user.map(t=>remuestrear(t));
  const near=(x,y)=>{let best=1e9,bi=-1;for(let i=0;i<mp.length;i++){const d=(mp[i].x-x)**2+(mp[i].y-y)**2;if(d<best){best=d;bi=i;}}return [Math.sqrt(best),bi];};
  // precisión
  let dentro=0,total=0; const idxs=[];
  us.forEach(t=>{const row=[];t.forEach(([x,y])=>{const [d,i]=near(x,y);total++;if(d<T)dentro++;row.push(i);});idxs.push(row);});
  const precision=dentro/Math.max(1,total);
  const okPts=user.map(t=>t.map(([x,y])=>near(x,y)[0]<T));
  // cobertura
  const uFlat=us.flat(); let cub=0,cubSec=0,nSec=0; const falt=[];
  mp.forEach(p=>{let ok=false;for(const q of uFlat){if((q[0]-p.x)**2+(q[1]-p.y)**2<T*T){ok=true;break;}} if(ok)cub++; else falt.push(p); if(!p.main){nSec++;if(ok)cubSec++;}});
  const cobertura=cub/mp.length;
  // inicio
  const m0=m.trazos[0].pts[0]; const u0=user[0][0];

  const dirOk=adel+atr<4||adel/(adel+atr)>=.62;
  // levantar el lápiz (palabras en minúscula)
  const esperados=contarTrazosEsperados(m.trazos);
  const levanta=G.tipo!=='letra'&&user.length>esperados+1;
  let nota=Math.round(100*(.55*cobertura+.45*precision));
  if(levanta)nota-=5; if(!inicioOk)nota=Math.min(nota-5,74); if(!dirOk)nota=Math.min(nota,50); nota=Math.max(0,Math.min(100,nota));
  const est=nota>=85?3:nota>=65?2:nota>=45?1:0;
  const msgs=[];
  if(!inicioOk&&G.ayuda!==4) msgs.push('Empieza en el punto verde.'); else if(!inicioOk) msgs.push('Fíjate dónde empieza la letra en el modelo.');
  if(!dirOk) msgs.push('Has trazado al revés: sigue la dirección de las flechas.');
  if(precision<.72) msgs.push('Te has salido del camino: ve más despacio y respeta las líneas de la pauta.');
  if(cobertura<.78) msgs.push('Te ha faltado una parte. Mira las marcas naranjas.');
  if(nSec&&cubSec/nSec<.5) msgs.push('No olvides el punto, la tilde o el palito.');
  if(levanta) msgs.push('Intenta no levantar el lápiz hasta acabar la palabra.');
  GB.resultado={okPts};
  // pintar zonas que faltan
  let rs=''; falt.forEach((p,i)=>{if(i%2===0)rs+=`<circle cx="${p.x}" cy="${p.y}" r="5" fill="#f97316" opacity=".85"/>`;});
  if(G.ayuda===4) $('#grModelo').innerHTML=`<g transform="translate(${-dx},0)">${dibujoModelo(m.trazos,2)}</g>`;
  $('#grRes').innerHTML=`<g transform="translate(${-dx},0)">${rs}</g>`;
  redibujarUser();
  const titulo=est===3?'¡Genial! Muy bien escrito.':est===2?'¡Bien! Casi perfecto.':est===1?'Vas mejorando. Inténtalo otra vez.':'Vamos a intentarlo de nuevo, despacio.';
  const fb=$('#grFb'); fb.className='feedback show '+(est>=3?'good':est>=1?'mid':'bad');
  fb.innerHTML=`<span class="stars" aria-label="${est} estrellas">${'★'.repeat(est)}${'☆'.repeat(3-est)}</span><div><div>${titulo} <span class="chip">${nota}/100</span></div>${msgs.length?`<ul>${msgs.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}<div class="small muted" style="margin-top:4px">Inicio ${inicioOk?'✓':'✗'} · Dirección ${dirOk?'✓':'✗'} · Dentro del trazo ${Math.round(precision*100)}% · Letra completa ${Math.round(cobertura*100)}%</div></div>`;
  const texto=G.items[G.idx];

}

function grafica(datos,maxY){

  return s+'</svg>';
}

function diffHTML(a,b){
  // LCS por caracteres
  const n=a.length,m=b.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0,out='';
  while(i<n&&j<m){if(a[i]===b[j]){out+=esc(a[i]);i++;j++;}else if(dp[i+1][j]>=dp[i][j+1]){out+=`<span class="bad">${esc(a[i])}</span>`;i++;}else{out+=`<span class="miss">${b[j]===' '?'␣':'_'}</span>`;j++;}}
  while(i<n){out+=`<span class="bad">${esc(a[i])}</span>`;i++;} while(j<m){out+='<span class="miss">_</span>';j++;}
  return `<span>${out}</span>`;
}

function itemABN(op,a,b,demo=false){

        if(op==='suma'&&A%10&&10-A%10<B)o.unshift([10-A%10,`Para llegar al ${A+10-A%10}: ${10-A%10}`]); if(B<10&&!o.length)o.push([B,`Todo: ${B}`]);}
      return uniq(o.map(z=>JSON.stringify(z))).map(z=>JSON.parse(z)).filter(z=>z[0]>0).slice(0,3);};
    const pregunta=()=>{ // [texto, correcta, celda]
      if(fase===0) return [rep?'¿Cuántos caramelos das a <b>cada niño</b>?':op==='suma'?`¿Cuánto pasas del <b>${B}</b> al <b>${A}</b>?`:`¿Cuánto quitas a los dos números?`,null,0];
      if(rep){ if(fase===1)return [`Si das ${x} a cada uno de los ${b} niños: <b>${b} × ${x}</b> =`,b*x,1]; if(fase===2)return [`Tenía ${A} y he repartido ${b*x}: <b>${A} − ${b*x}</b> =`,A-b*x,2]; return [`Cada niño llevaba ${Q} y le doy ${x} más: <b>${Q} + ${x}</b> =`,Q+x,3]; }

      if(fase===1)return [`Al primero le quito ${x}: <b>${A} − ${x}</b> =`,A-x,1]; return [`Al segundo le quito ${x}: <b>${B} − ${x}</b> =`,B-x,2];

const NOMS=['Ana','Luis','Sara','Omar','Lucía','Iván','Fátima','Pablo','Nora','Hugo'];
const OBJS=[['canicas','🔵'],['manzanas','🍎'],['cromos','🃏'],['lápices','✏️'],['globos','🎈'],['caramelos','🍬'],['pegatinas','⭐'],['libros','📘']];
NUM_EXTRA.problemas=(run,R)=>run(()=>{
  const lim=Math.min(R,100); const [o,e]=pick(OBJS); const [n1,n2]=shuffle(NOMS);
  const tipo=pick(['juntar','combinar','quitar','comparar','igualar']);
  let a=2+rnd(Math.max(2,lim/2-2)),b=1+rnd(Math.max(1,lim/2-2));
  if(['quitar','comparar','igualar'].includes(tipo)&&b>=a){[a,b]=[b+1,a];}
  const T={juntar:[`${n1} tiene ${a} ${o}. Le regalan ${b} más. ¿Cuántos ${o} tiene ahora?`,'+',a+b],
    combinar:[`En una caja hay ${a} ${o} rojos y ${b} azules. ¿Cuántos ${o} hay en total?`,'+',a+b],
    quitar:[`${n1} tenía ${a} ${o} y ha perdido ${b}. ¿Cuántos ${o} le quedan?`,'−',a-b],
    comparar:[`${n1} tiene ${a} ${o} y ${n2} tiene ${b}. ¿Cuántos ${o} tiene ${n1} más que ${n2}?`,'−',a-b],
    igualar:[`${n1} tiene ${a} ${o}. ${n2} tiene ${b}. ¿Cuántos le faltan a ${n2} para tener los mismos que ${n1}?`,'−',a-b]}[tipo];
  const dib=(a<=10&&b<=10)?`<div class="prob-dib"><div>${e.repeat(a)}</div><div>${e.repeat(b)}</div></div>`:'';
  return {render:(el,done)=>{
    el.innerHTML=`<div class="prob-txt">${T[0]}</div><button class="btn sec sm" id="pbVoz">🔊 Leer</button>${dib}<div class="ex-q" style="margin-top:12px">1. ¿Qué operación haces?</div><div class="opts"><button class="opt" data-o="+">+ sumar</button><button class="opt" data-o="−">− restar</button></div><div id="pbP2" hidden><div class="ex-q" style="margin-top:12px">2. ¿Cuál es la solución?</div><div class="row" style="justify-content:center"><input type="number" inputmode="numeric" id="pbIn" style="width:160px;font-size:2rem;text-align:center;font-weight:800" aria-label="Solución"><button class="btn ok" id="pbOk">Comprobar</button></div></div>`;
    $('#pbVoz').onclick=()=>hablar(T[0]); let opOk=false;
    $$('[data-o]',el).forEach(x=>x.onclick=()=>{opOk=x.dataset.o===T[1];x.classList.add(opOk?'ok':'no');$$('[data-o]',el).forEach(y=>y.disabled=true);if(!opOk)$$('[data-o]',el).find(y=>y.dataset.o===T[1]).classList.add('ok');$('#pbP2').hidden=false;$('#pbIn').focus();});
    const ir=()=>{const v=$('#pbIn').value;if(v==='')return;$('#pbOk').disabled=true;done(opOk&&+v===T[2],`${tipo==='juntar'||tipo==='combinar'?a+' + '+b:a+' − '+b} = ${T[2]} ${o}`);};
    $('#pbOk').onclick=ir;$('#pbIn').onkeydown=e=>{if(e.key==='Enter')ir();};
  }};
});

const COLS=['#ef4444','#2563eb','#16a34a','#eab308'], FIGS=['●','▲','■','★'];

/* Unidades de lectura de una palabra (para saber qué lecciones necesita) */
function unidadesLectura(w){
  const s=w.toLowerCase().replace(/[áàä]/g,'a').replace(/[éè]/g,'e').replace(/[íï]/g,'i').replace(/[óö]/g,'o').replace(/ú/g,'u').replace(/[^a-zñü]/g,'');
  const u=new Set(); const V='aeiouü';
  for(let i=0;i<s.length;i++){
    const c=s[i],n=s[i+1]||'',p=s[i-1]||'';
    if(V.includes(c)){u.add('vocales');continue;}
    const d2=c+n;
    if(d2==='ch'){u.add('ch');i++;continue;} if(d2==='ll'){u.add('ll');i++;continue;} if(d2==='rr'){u.add('rr');i++;continue;}
    if(d2==='qu'){u.add('qu');i++;continue;}
    if(['pl','bl','cl','fl','gl','pr','br','cr','dr','fr','gr','tr'].includes(d2)&&V.includes(s[i+2]||'')) u.add('trab');
    if(c==='c'){u.add('eiéí'.includes(n)?'z':'c');continue;}
    if(c==='g'){ if('ei'.includes(n)) u.add('j'); else u.add('g'); if(n==='u'&&'eiü'.includes(s[i+2]||''))i++; if(n==='ü')u.add('g'); continue;}
    if(c==='r'){u.add(i===0||'lns'.includes(p)?'rr':'r');continue;}
    if('kwx'.includes(c)){u.add('k');continue;}
    u.add(c);
  }
  return u;
}

  const porL=resumenGrafia(id);
  const media=arr=>Math.round(arr.reduce((s,x)=>s+x.n,0)/arr.length);
  const letrasHTML=Object.keys(porL).length?`<div class="lgrid">${Object.entries(porL).sort().map(([l,arr])=>{const ult=arr.slice(-3);const m=media(ult);return `<div class="${m>=85?'n3':m>=65?'n2':'n1'}">${esc(l)}<small>${m} · ${arr.length} int.</small></div>`;}).join('')}</div><p class="small muted">Media de los 3 últimos intentos. Verde: consolidada · Amarillo: en proceso · Rojo: reforzar.</p>`:'<p class="muted small">Aún no hay letras practicadas sueltas.</p>';
  const ultG=gr.slice(-12).reverse();
  const errDir=gr.filter(x=>!x.dir).length, errIni=gr.filter(x=>!x.ini).length;
  const tabla=(arr,cols)=>arr.length?`<table class="t"><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${arr.map(x=>`<tr>${cols.map(c=>`<td>${c[1](x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<p class="muted small">Sin registros.</p>';
  const ay=['','Flechas','Punteado','Inicio','Copia'];
  c.innerHTML=`<div class="card"><div class="sec-title"><h2 style="margin:0">Progreso de ${esc(a.nombre)}</h2><button class="btn sec" id="alInf">🖨 Informe</button></div>
   <div class="stat" style="margin-bottom:16px"><div><b>${gr.length}</b><span>trazos de grafía</span></div><div><b>${gr.length?media(gr):'—'}</b><span>nota media grafía</span></div><div><b>${le.length?le.at(-1).pcpm:'—'}</b><span>últ. palabras correctas/min</span></div><div><b>${fo.length+nu.length}</b><span>series de ejercicios</span></div></div>
   <p><b>Cartilla de lectura:</b> ${(DB.cartilla?.[id]||[]).length} de ${LECCIONES.length} lecciones superadas${(DB.cartilla?.[id]||[]).length?' ('+LECCIONES.filter(l=>(DB.cartilla[id]||[]).includes(l.k)).map(l=>esc(l.t)).join(', ')+')':''}.</p>
   <h3>Grafía · letras</h3>${letrasHTML}
   ${gr.length?`<p class="small"><b>Errores de inicio:</b> ${errIni} de ${gr.length} · <b>Errores de dirección:</b> ${errDir} de ${gr.length}</p>`:''}
   <h3 style="margin-top:14px">Últimos trazos</h3>${tabla(ultG,[['Fecha',x=>fecha(x.t)],['Qué',x=>esc(x.i)],['Ayuda',x=>ay[x.ay]||''],['Nota',x=>x.n],['Inicio',x=>x.ini?'✓':'✗'],['Dirección',x=>x.dir?'✓':'✗']])}
   <h3 style="margin-top:14px">Lectura</h3>${le.length?grafica(le.map(x=>({e:fecha(x.t),v:x.pcpm}))):''}${tabla(le.slice(-8).reverse(),[['Fecha',x=>fecha(x.t)],['Texto',x=>esc(x.i)],['PCPM',x=>x.pcpm],['PPM',x=>x.ppm],['Precisión',x=>x.prec+'%']])}
   <h3 style="margin-top:14px">Fonología, ortografía y números</h3>${tabla([...fo,...nu].sort((x,y)=>y.t-x.t).slice(0,15),[['Fecha',x=>fecha(x.t)],['Actividad',x=>esc(x.i)],['Aciertos',x=>x.ok+'/'+x.tot],['%',x=>x.pct+'%']])}
   <h3 style="margin-top:14px">Funciones ejecutivas</h3>${tabla(ff.slice(-10).reverse(),[['Fecha',x=>fecha(x.t)],['Actividad',x=>esc(x.i)],['Resultado',x=>x.span!=null?'Serie máx.: '+x.span:`${x.ac} encontradas · ${x.om} olvidadas · ${x.fa} errores · ${x.seg}s`]])}
   ${a.obs?`<h3 style="margin-top:14px">Observaciones</h3><p>${esc(a.obs)}</p>`:''}</div>`;
  $('#alInf').onclick=()=>{const w=window.open('','_blank');if(!w){toast('Permite las ventanas emergentes','error');return;}
    w.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><base href="${location.href}"><title>Informe ${esc(a.nombre)}</title><style>@page{size:A4 portrait;margin:15mm}body{font-family:Nunito,Arial,sans-serif;color:#1e293b;font-size:11pt}h2,h3{color:#0f2f6b}table{width:100%;border-collapse:collapse;font-size:9.5pt}th,td{border-bottom:1px solid #cbd5e1;padding:4px;text-align:left}.lgrid{display:flex;flex-wrap:wrap;gap:4px}.lgrid div{border:1px solid #cbd5e1;border-radius:6px;padding:4px 8px;text-align:center;font-weight:800}.lgrid small{display:block;font-weight:600;font-size:7.5pt}.n3{background:#dcfce7}.n2{background:#fef9c3}.n1{background:#fee2e2}.stat{display:flex;gap:8px}.stat div{border:1px solid #cbd5e1;border-radius:8px;padding:6px 10px;text-align:center}.stat b{display:block;font-size:16pt}.stat span{font-size:8pt}button{display:none}header{display:flex;gap:12px;align-items:center;border-bottom:2px solid #0f2f6b;margin-bottom:10px;padding-bottom:6px}header img{height:50px}</style></head><body>
    <header><img src="LOGO.jpg" alt="" onerror="this.remove()"><div><b>CEIP Capitulaciones · Santa Fe</b><br>Aula de Pedagogía Terapéutica · Informe de seguimiento · ${new Date().toLocaleDateString('es-ES')}</div></header>
    <p><b>Alumno/a:</b> ${esc(a.nombre)} · <b>Curso:</b> ${esc(a.curso||'')} · <b>Necesidades:</b> ${esc((a.nec||[]).join(', '))}</p>${c.querySelector('.card').innerHTML}<scr${''}ipt>setTimeout(()=>print(),500)<\/script></body></html>`);w.document.close();};
}
function exportar(){
  const blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='aula-pt-copia-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Copia descargada');
}
function importar(e){
  const f=e.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.alumnos))throw 0;
    modal('Restaurar copia',`<p>La copia tiene <b>${d.alumnos.length}</b> alumnos y <b>${(d.reg||[]).length}</b> registros.</p><p>¿Quieres <b>añadirla</b> a lo que ya hay o <b>sustituir</b> todo?</p>`,[{t:'Cancelar'},{t:'Añadir',c:'sec',f:()=>{const ids=new Set(DB.alumnos.map(a=>a.id));d.alumnos.forEach(a=>{if(!ids.has(a.id))DB.alumnos.push(a);});const k=new Set(DB.reg.map(x=>x.a+x.t));(d.reg||[]).forEach(x=>{if(!k.has(x.a+x.t))DB.reg.push(x);});DB.agenda=Object.assign({},d.agenda||{},DB.agenda);guardar();pintarAlumnos();pintarChip();toast('Copia añadida');}},{t:'Sustituir todo',c:'danger',f:()=>{DB=Object.assign({alumnos:[],activo:null,reg:[],agenda:{},ajustes:{}},d);guardar();pintarAlumnos();pintarChip();toast('Copia restaurada');}}]);
  }catch(err){toast('El archivo no es una copia válida','error');}};
  r.readAsText(f); e.target.value='';
}

/* ===== Arranque ===== */
pintarChip();
const inicio=(location.hash||'#home').slice(1);
history.replaceState({v:'home'},'','#home');
ir(TITULOS[inicio]?inicio:'home', inicio!=='home');
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
